name: Learning demo
on:
  push:
    paths: ['experiments/learning-demo/**', 'dist/lib/model.js', '.github/workflows/learning-demo.yml']
  pull_request:
    paths: ['experiments/learning-demo/**', 'dist/lib/model.js', '.github/workflows/learning-demo.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test experiments/learning-demo/*.test.mjs
